<nb-card>
  <nb-card-header>{{ 'passwd_policy.title' | translate }}</nb-card-header>
  <nb-card-body>
    <div class="row">
      <div class="col-sm-12">
        <div class="form-group">
          <label for="min_length">{{ 'passwd_policy.min_length' | translate }}</label>
          <input [(ngModel)]="passPolicy.min_length" [ngModelOptions]="{standalone: true}" type="number" 
            class="form-control" id="min_length" min="1" required/>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-sm-6">
        <div class="form-group">
          <label for="min_lowercase">{{ 'passwd_policy.min_lower_case' | translate }}</label>
          <input [(ngModel)]="passPolicy.min_lowercase" [ngModelOptions]="{standalone: true}" type="number" 
            class="form-control" id="min_lowercase" min="1" required>
        </div>
      </div>
      <div class="col-sm-6">
        <div class="form-group">
          <label for="min_numbers">{{ 'passwd_policy.min_number' | translate }}</label>
          <input [(ngModel)]="passPolicy.min_numbers" [ngModelOptions]="{standalone: true}" type="number" 
            class="form-control" id="min_numbers" min="1" required>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-sm-6">
        <div class="form-group">
          <label for="special_character">{{ 'passwd_policy.min_symbol' | translate }}</label>
          <input [(ngModel)]="passPolicy.special_character" [ngModelOptions]="{standalone: true}" type="number" 
            class="form-control" id="special_character" min="1" required>
        </div>
      </div>
      <div class="col-sm-6">
        <div class="form-group">
          <label for="min_uppercase">{{ 'passwd_policy.min_upper_case' | translate }}</label>
          <input [(ngModel)]="passPolicy.min_uppercase" [ngModelOptions]="{standalone: true}" type="number" 
            class="form-control" id="min_uppercase" min="1" required/>
        </div>
      </div>
    </div>
  </nb-card-body>
</nb-card>

<nb-card>
  <nb-card-header>{{ 'passwd_policy.pass_exp' | translate }}</nb-card-header>
  <nb-card-body>
    <div class="row">
      <div class="col-sm-6">
        <div class="form-group">
          <label for="passwordExpires">{{ 'passwd_policy.pass_limit' | translate }}</label>
          <div class="input-group">
            <input [(ngModel)]="passPolicy.passwd_exp_limit" [ngModelOptions]="{standalone: true}" type="number" 
              class="form-control" id="passwordExpires" min="1" required />
            <div class="input-group-append">
              <span class="input-group-text">days</span>
            </div>
          </div>
        </div>
      </div>
      <div class="col-sm-6">
        <div class="form-group">
          <label for="nofify">{{ 'passwd_policy.nofity' | translate }}</label>
          <div class="input-group">
            <input [(ngModel)]="passPolicy.passwd_email_notify" [ngModelOptions]="{standalone: true}" type="number" 
              class="form-control" id="passwd_email_notify" min="1" required />
            <div class="input-group-append">
              <span class="input-group-text">days</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nb-card-body>
</nb-card>
<nb-card>
  <nb-card-header>{{ 'passwd_policy.attempts&history' | translate }}</nb-card-header>
  <nb-card-body>
    <div class="row">
      <div class="col-sm-6">
        <div class="form-group">
          <label for="attempts">{{ 'passwd_policy.max_attempts' | translate }}</label>
          <input [(ngModel)]="passPolicy.failed_attempts" [ngModelOptions]="{standalone: true}" type="number" 
            class="form-control" id="attempts" min="1" required />
        </div>
      </div>
      <div class="col-sm-6">
        <div class="form-group">
          <label for="history">{{ 'passwd_policy.max_pass_history' | translate }}</label>
          <input [(ngModel)]="passPolicy.passwd_history" [ngModelOptions]="{standalone: true}" type="number" 
            class="form-control" id="history" min="1" required/>
        </div>
      </div>
    </div>
  </nb-card-body>
</nb-card>

<nb-card>
  <nb-card-header>{{ 'passwd_policy.head' | translate }}</nb-card-header>
  <nb-card-body>
    <div class="row">
      <div class="col-sm-12">
        <div class="form-group">
          <label for="sessiontime">{{ 'passwd_policy.session_timeout' | translate }}</label>
          <div class="input-group">
            <input [(ngModel)]="passPolicy.sessiontime" [ngModelOptions]="{standalone: true}" type="number" 
              class="form-control" id="sessiontime" required min="1"/>
            <div class="input-group-append">
              <span class="input-group-text">mintues</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nb-card-body>
</nb-card>



<div>
  <button type="button" class="btn btn-success" (click)="addPolicy()">{{ 'buttons.submit' | translate }}</button> 
</div>
