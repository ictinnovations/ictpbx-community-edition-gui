<nb-card>
  <nb-card-header>
    <span>Device Profiles</span>
    <button nbButton status="primary" size="small" [routerLink]="['/pages/devices/profiles/new']" style="float:right">
      <nb-icon icon="plus-outline"></nb-icon> Add Profile
    </button>
  </nb-card-header>
  <nb-card-body>
    <div class="row mb-3" *ngIf="isAdmin">
      <div class="col-auto">
        <nb-select [(selected)]="selectedTenant" (selectedChange)="loadList()" style="min-width:180px">
          <nb-option [value]="0">All Tenants</nb-option>
          <nb-option *ngFor="let t of tenants" [value]="t.tenant_id">{{t.company}}</nb-option>
        </nb-select>
      </div>
    </div>
    <mat-table #table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="device_profile_name">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Profile Name</mat-header-cell>
        <mat-cell *matCellDef="let row">{{ row.device_profile_name }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="device_profile_enabled">
        <mat-header-cell *matHeaderCellDef>Enabled</mat-header-cell>
        <mat-cell *matCellDef="let row">
          <nb-icon [icon]="row.device_profile_enabled === 'true' || row.device_profile_enabled === true ? 'checkmark-circle-2-outline' : 'close-circle-outline'"
                   [status]="row.device_profile_enabled === 'true' || row.device_profile_enabled === true ? 'success' : 'danger'"></nb-icon>
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="operations">
        <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
        <mat-cell *matCellDef="let row">
          <button nbButton ghost size="small" [routerLink]="['/pages/devices/profiles', row.device_profile_uuid]">
            <nb-icon icon="edit-2-outline" status="primary"></nb-icon>
          </button>
          <button nbButton ghost size="small" (click)="openDeleteDialog(row.device_profile_uuid, deleteDialog)">
            <nb-icon icon="trash-2-outline" status="danger"></nb-icon>
          </button>
        </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>

    <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
  </nb-card-body>
</nb-card>

<ng-template #deleteDialog let-data>
  <nb-card>
    <nb-card-header>Confirm Delete</nb-card-header>
    <nb-card-body>Are you sure you want to delete this device profile?</nb-card-body>
    <nb-card-footer>
      <button nbButton status="danger" (click)="confirmDelete()">Delete</button>
      <button nbButton ghost (click)="cancelDelete()">Cancel</button>
    </nb-card-footer>
  </nb-card>
</ng-template>
