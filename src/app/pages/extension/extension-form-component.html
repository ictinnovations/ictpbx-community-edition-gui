<div *ngIf="isError" class="ict_error">
  <p *ngFor="let err of errorText">{{err}}</p>
</div>

<h3>{{ account_id > 0 ? ('extension.edit' | translate) : ('extension.add' | translate) }}</h3>
<div class="col-lg-12">
  <form id="form" #f1="ngForm">
    <nb-card>
      <nb-card-header>{{ 'extension.extension_info' | translate}}</nb-card-header>
      <nb-card-body>

        <div class="row">
          <div class="col-sm-6">
            <div class="form-group">
              <label>Account Type:</label>
              <select class="form-control" [(ngModel)]="extension.type" [ngModelOptions]="{standalone: true}"
                (ngModelChange)="onTypeChange($event)">
                <option *ngFor="let t of accountTypes" [value]="t">{{t | titlecase}}</option>
              </select>
            </div>
          </div>
        </div>

        <!-- DID type: free-text phone -->
        <div class="row" *ngIf="extension.type === 'did'">
          <div class="col-sm-6">
            <div class="form-group">
              <label for="phone_did">DID Number:</label>
              <input [(ngModel)]="extension.phone" [ngModelOptions]="{standalone: true}" type="text" class="form-control"
                placeholder="e.g. 12125551234" id="phone_did" pattern="[0-9]*" minlength="7" maxlength="16" required/>
            </div>
          </div>
          <div class="col-sm-6">
            <div class="form-group">
              <label for="email">Email (fax delivery):</label>
              <input [(ngModel)]="extension.email" [ngModelOptions]="{standalone: true}" type="email" class="form-control"
                placeholder="fax@example.com" id="email"/>
            </div>
          </div>
        </div>

        <!-- Account type: PBX extension dropdown + email -->
        <div class="row" *ngIf="extension.type === 'account'">
          <div class="col-sm-6">
            <div class="form-group">
              <label>PBX Extension:</label>
              <div *ngIf="noExtensionsAvailable" class="alert alert-warning" style="margin-bottom:8px">
                No available PBX extensions. Create a PBX Extension first.
              </div>
              <select class="form-control" [(ngModel)]="extension.phone" [ngModelOptions]="{standalone: true}"
                [disabled]="noExtensionsAvailable">
                <option value="">— Select extension —</option>
                <option *ngFor="let ext of availableExtensions" [value]="ext.extension">{{ext.extension}}</option>
              </select>
            </div>
          </div>
          <div class="col-sm-6">
            <div class="form-group">
              <label for="email_acct">Email (fax delivery):</label>
              <input [(ngModel)]="extension.email" [ngModelOptions]="{standalone: true}" type="email" class="form-control"
                placeholder="fax@example.com" id="email_acct"/>
            </div>
          </div>
        </div>

        <!-- Account type: link to DID -->
        <div class="row" *ngIf="extension.type === 'account'">
          <div class="col-sm-6">
            <div class="form-group">
              <label for="linkdid_id">Link to DID Account:</label>
              <select class="form-control" [(ngModel)]="extension.linkdid_id" [ngModelOptions]="{standalone: true}" id="linkdid_id">
                <option [ngValue]="null">— None —</option>
                <option *ngFor="let d of didList" [ngValue]="d.account_id">{{d.phone}} ({{d.email || d.username}})</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Account type: username + password -->
        <div class="row" *ngIf="extension.type === 'account'">
          <div class="col-sm-6">
            <div class="form-group">
              <label for="username">{{ 'extension.username' | translate}}:</label>
              <input [(ngModel)]="extension.username" [ngModelOptions]="{standalone: true}" type="text" class="form-control"
                placeholder="{{ 'extension.username' | translate}}" id="username" required/>
            </div>
          </div>
          <div class="col-sm-6">
            <div class="form-group">
              <label for="passwd">{{ 'extension.password' | translate}}</label>
              <input type="password" class="form-control" id="passwd" [(ngModel)]="extension.passwd" name="passwd">
            </div>
          </div>
        </div>


      </nb-card-body>
    </nb-card>

    <nb-card>
      <nb-card-header>{{ 'extension.active' | translate}}</nb-card-header>
      <nb-card-body>
        <div class="row">
          <div class="col-sm-6">
            <div class="form-group">
              <label>{{ 'extension.active' | translate}}:</label>
              <input [(ngModel)]="extension.active" [ngModelOptions]="{standalone: true}" type="radio" name="active" value="0"> {{ 'extension.no' | translate}}
              <input [(ngModel)]="extension.active" [ngModelOptions]="{standalone: true}" type="radio" name="active" value="1"> {{ 'extension.yes' | translate}}
            </div>
          </div>
        </div>
      </nb-card-body>
    </nb-card>

    <div *ngIf="account_id > 0">
      <button type="button" class="btn btn-primary" (click)="updateExtension()">{{ 'buttons.update' | translate}}</button>
    </div>
    <div *ngIf="!account_id">
      <button type="button" class="btn btn-success" (click)="addExtension()">{{ 'buttons.submit' | translate}}</button>
    </div>
  </form>
</div>
