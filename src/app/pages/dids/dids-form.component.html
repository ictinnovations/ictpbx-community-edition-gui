<nb-card>
  <nb-card-header>{{ isEdit ? 'Edit DID' : 'Add DID Number' }}</nb-card-header>
  <nb-card-body>

    <div class="alert alert-danger" *ngIf="isError">
      <ul><li *ngFor="let e of errorText">{{ e }}</li></ul>
    </div>
    <div class="alert alert-success" *ngIf="isSuccess">DID saved successfully.</div>

    <div class="form-group row">
      <label class="col-sm-3 col-form-label">Phone Number *</label>
      <div class="col-sm-9">
        <input nbInput fullWidth [(ngModel)]="did.phone" placeholder="+12125551234" [disabled]="isEdit">
        <small class="text-muted">Full E.164 number (e.g. +12125551234)</small>
      </div>
    </div>

    <div class="form-group row">
      <label class="col-sm-3 col-form-label">Assign to Tenant *</label>
      <div class="col-sm-9">
        <select nbSelect fullWidth [(ngModel)]="did.tenant_id">
          <option [ngValue]="undefined">-- Select Tenant --</option>
          <option *ngFor="let t of tenants" [value]="t.tenant_id">{{ t.company }}</option>
        </select>
      </div>
    </div>

    <div class="form-group row">
      <label class="col-sm-3 col-form-label">SIP Host / Domain</label>
      <div class="col-sm-9">
        <input nbInput fullWidth [(ngModel)]="did.domain" placeholder="e.g. sip.provider.com">
        <small class="text-muted">The SIP carrier host that routes this DID number inbound.</small>
      </div>
    </div>

    <div class="form-group row">
      <label class="col-sm-3 col-form-label">Description</label>
      <div class="col-sm-9">
        <input nbInput fullWidth [(ngModel)]="did.description" placeholder="Optional label">
      </div>
    </div>

  </nb-card-body>
  <nb-card-footer>
    <button nbButton status="primary" (click)="save()">{{ isEdit ? 'Update' : 'Save' }}</button>
    <button nbButton ghost [routerLink]="['/pages/dids/dids']">Cancel</button>
  </nb-card-footer>
</nb-card>
