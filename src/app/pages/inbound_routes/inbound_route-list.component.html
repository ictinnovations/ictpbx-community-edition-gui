<nb-card>
  <nb-card-header>
    <span>Inbound Routes</span>
    <button nbButton status="primary" size="small" [routerLink]="['/pages/inbound_routes/inbound_routes/new']" style="float:right">
      <nb-icon icon="plus-outline"></nb-icon> Add Route
    </button>
  </nb-card-header>
  <nb-card-body>
    <div class="row mb-3" *ngIf="isAdmin">
      <div class="col-auto">
        <nb-select [(selected)]="selectedTenant" (selectedChange)="loadList()" style="min-width:180px">
          <nb-option [value]="0">All Tenants</nb-option>
          <nb-option *ngFor="let t of tenants" [value]="t.tenant_id">{{t.company}}</nb-option>
        </nb-select>
      </div>
    </div>
    <mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="destination_number">
        <mat-header-cell *matHeaderCellDef mat-sort-header>DID Number</mat-header-cell>
        <mat-cell *matCellDef="let row">{{ row.destination_number }}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="destination_data">
        <mat-header-cell *matHeaderCellDef>Routes To</mat-header-cell>
        <mat-cell *matCellDef="let row">{{ row.destination_data }}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="destination_order">
        <mat-header-cell *matHeaderCellDef>Order</mat-header-cell>
        <mat-cell *matCellDef="let row">{{ row.destination_order }}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="destination_enabled">
        <mat-header-cell *matHeaderCellDef>Enabled</mat-header-cell>
        <mat-cell *matCellDef="let row">
          <nb-icon [icon]="row.destination_enabled === 'true' || row.destination_enabled === true ? 'checkmark-circle-2-outline' : 'close-circle-outline'"
                   [status]="row.destination_enabled === 'true' || row.destination_enabled === true ? 'success' : 'danger'"></nb-icon>
        </mat-cell>
      </ng-container>
      <ng-container matColumnDef="operations">
        <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
        <mat-cell *matCellDef="let row">
          <button nbButton ghost size="small" [routerLink]="['/pages/inbound_routes/inbound_routes', row.destination_uuid]">
            <nb-icon icon="edit-2-outline" status="primary"></nb-icon>
          </button>
          <button nbButton ghost size="small" (click)="openDeleteDialog(row.destination_uuid, deleteDialog)">
            <nb-icon icon="trash-2-outline" status="danger"></nb-icon>
          </button>
        </mat-cell>
      </ng-container>
      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
    <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
  </nb-card-body>
</nb-card>

<ng-template #deleteDialog let-data>
  <nb-card>
    <nb-card-header>Confirm Delete</nb-card-header>
    <nb-card-body>Delete this inbound route? This will also remove the associated dialplan entry.</nb-card-body>
    <nb-card-footer>
      <button nbButton status="danger" (click)="confirmDelete()">Delete</button>
      <button nbButton ghost (click)="cancelDelete()">Cancel</button>
    </nb-card-footer>
  </nb-card>
</ng-template>
