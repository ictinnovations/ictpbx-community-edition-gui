<nb-card>
  <nb-card-header>
    <span>Voicemail Boxes</span>
    <button nbButton status="primary" size="small" [routerLink]="['/pages/voicemails/voicemails/new']" style="float:right">
      <nb-icon icon="plus-outline"></nb-icon> Add Voicemail
    </button>
  </nb-card-header>
  <nb-card-body>
    <div class="row mb-3" *ngIf="isAdmin">
      <div class="col-auto">
        <nb-select [(selected)]="selectedTenant" (selectedChange)="loadList()" style="min-width:180px">
          <nb-option [value]="0">All Tenants</nb-option>
          <nb-option *ngFor="let t of tenants" [value]="t.tenant_id">{{t.company}}</nb-option>
        </nb-select>
      </div>
    </div>
    <mat-table #table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="voicemail_id">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Box Number</mat-header-cell>
        <mat-cell *matCellDef="let row">{{ row.voicemail_id }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="voicemail_mail_to">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Email</mat-header-cell>
        <mat-cell *matCellDef="let row">{{ row.voicemail_mail_to }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="greeting_count">
        <mat-header-cell *matHeaderCellDef>Greetings</mat-header-cell>
        <mat-cell *matCellDef="let row">{{ row.greeting_count }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="voicemail_enabled">
        <mat-header-cell *matHeaderCellDef>Enabled</mat-header-cell>
        <mat-cell *matCellDef="let row">
          <nb-icon [icon]="(row.voicemail_enabled === true || row.voicemail_enabled === 'true') ? 'checkmark-circle-2-outline' : 'close-circle-outline'"
                   [status]="(row.voicemail_enabled === true || row.voicemail_enabled === 'true') ? 'success' : 'danger'"></nb-icon>
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="tenant_name">
        <mat-header-cell *matHeaderCellDef>Tenant</mat-header-cell>
        <mat-cell *matCellDef="let row">{{ row.tenant_name || '—' }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="operations">
        <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
        <mat-cell *matCellDef="let row">
          <button nbButton ghost size="small" [routerLink]="['/pages/voicemails/voicemails', row.voicemail_uuid]">
            <nb-icon icon="edit-2-outline" status="primary"></nb-icon>
          </button>
          <button nbButton ghost size="small" (click)="openDeleteDialog(row.voicemail_uuid, deleteDialog)">
            <nb-icon icon="trash-2-outline" status="danger"></nb-icon>
          </button>
        </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>

    <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
  </nb-card-body>
</nb-card>

<ng-template #deleteDialog let-data>
  <nb-card>
    <nb-card-header>Confirm Delete</nb-card-header>
    <nb-card-body>Are you sure you want to delete this voicemail box and all its greetings?</nb-card-body>
    <nb-card-footer>
      <button nbButton status="danger" (click)="confirmDelete()">Delete</button>
      <button nbButton ghost (click)="cancelDelete()">Cancel</button>
    </nb-card-footer>
  </nb-card>
</ng-template>
