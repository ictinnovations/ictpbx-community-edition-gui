<nb-card>
  <nb-card-header>
    <span>Gateways (SIP Trunks)</span>
    <button nbButton status="primary" size="small" [routerLink]="['/pages/gateways/gateways/new']" style="float:right">
      <nb-icon icon="plus-outline"></nb-icon> Add Gateway
    </button>
  </nb-card-header>
  <nb-card-body>
    <mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="gateway">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Name</mat-header-cell>
        <mat-cell *matCellDef="let row">{{ row.gateway }}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="username">
        <mat-header-cell *matHeaderCellDef>Username</mat-header-cell>
        <mat-cell *matCellDef="let row">{{ row.username }}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="realm">
        <mat-header-cell *matHeaderCellDef>Realm / Host</mat-header-cell>
        <mat-cell *matCellDef="let row">{{ row.realm || row.proxy }}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="register">
        <mat-header-cell *matHeaderCellDef>Register</mat-header-cell>
        <mat-cell *matCellDef="let row">
          <nb-icon [icon]="row.register === 'true' || row.register === true ? 'checkmark-circle-2-outline' : 'close-circle-outline'"
                   [status]="row.register === 'true' || row.register === true ? 'success' : 'basic'"></nb-icon>
        </mat-cell>
      </ng-container>
      <ng-container matColumnDef="profile">
        <mat-header-cell *matHeaderCellDef>Profile</mat-header-cell>
        <mat-cell *matCellDef="let row">{{ row.profile }}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="enabled">
        <mat-header-cell *matHeaderCellDef>Enabled</mat-header-cell>
        <mat-cell *matCellDef="let row">
          <nb-icon [icon]="row.enabled === 'true' || row.enabled === true ? 'checkmark-circle-2-outline' : 'close-circle-outline'"
                   [status]="row.enabled === 'true' || row.enabled === true ? 'success' : 'danger'"></nb-icon>
        </mat-cell>
      </ng-container>
      <ng-container matColumnDef="operations">
        <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
        <mat-cell *matCellDef="let row">
          <button nbButton ghost size="small" [routerLink]="['/pages/gateways/gateways', row.gateway_uuid]">
            <nb-icon icon="edit-2-outline" status="primary"></nb-icon>
          </button>
          <button nbButton ghost size="small" (click)="openDeleteDialog(row.gateway_uuid, deleteDialog)">
            <nb-icon icon="trash-2-outline" status="danger"></nb-icon>
          </button>
        </mat-cell>
      </ng-container>
      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
    <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
  </nb-card-body>
</nb-card>

<ng-template #deleteDialog let-data>
  <nb-card>
    <nb-card-header>Confirm Delete</nb-card-header>
    <nb-card-body>Are you sure you want to delete this gateway?</nb-card-body>
    <nb-card-footer>
      <button nbButton status="danger" (click)="confirmDelete()">Delete</button>
      <button nbButton ghost (click)="cancelDelete()">Cancel</button>
    </nb-card-footer>
  </nb-card>
</ng-template>
