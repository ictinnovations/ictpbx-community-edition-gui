<nb-card>
  <nb-card-header>
    DID Management
    <button *ngIf="isAdmin" nbButton status="primary" size="small" style="float:right"
            [routerLink]="['/pages/dids/dids/new']">Add DID</button>
  </nb-card-header>
  <nb-card-body>

    <div class="alert alert-danger" *ngIf="isError">{{ errorText }}</div>
    <div class="alert alert-success" *ngIf="isSuccess">{{ successText }}</div>

    <table style="width:100%;border-collapse:collapse">
      <thead>
        <tr style="border-bottom:1px solid #ccc">
          <th style="padding:8px;text-align:left">Phone Number</th>
          <th *ngIf="isAdmin" style="padding:8px;text-align:left">Tenant</th>
          <th style="padding:8px;text-align:left">Fax Account</th>
          <th style="padding:8px;text-align:left">Description</th>
          <th style="padding:8px;text-align:left">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let did of dids" style="border-bottom:1px solid #eee">
          <td style="padding:8px">{{ did.phone }}</td>
          <td *ngIf="isAdmin" style="padding:8px">
            <span *ngIf="assigningTenantId !== did.id">
              {{ did.tenant_name || did.tenant_id }}
              <button nbButton ghost size="tiny" style="margin-left:4px" (click)="startAssignTenant(did)" title="Reassign Tenant">
                <nb-icon icon="swap-outline"></nb-icon>
              </button>
            </span>
            <span *ngIf="assigningTenantId === did.id" style="display:flex;align-items:center;gap:4px">
              <select [(ngModel)]="newTenantId" [ngModelOptions]="{standalone:true}" class="form-control form-control-sm" style="width:auto;min-width:120px">
                <option *ngFor="let t of tenants" [ngValue]="t.tenant_id">{{ t.company }}</option>
              </select>
              <button nbButton status="success" size="tiny" (click)="saveAssignTenant(did)">Save</button>
              <button nbButton ghost size="tiny" (click)="cancelAssignTenant()">Cancel</button>
            </span>
          </td>
          <td style="padding:8px">
            <span *ngIf="assigningId !== did.id">
              {{ did.fax_account_name || 'Unassigned' }}
            </span>
            <span *ngIf="assigningId === did.id">
              <select nbSelect [(ngModel)]="assignAccountId" size="small">
                <option [ngValue]="null">-- Unassigned --</option>
                <option *ngFor="let fa of faxAccounts" [ngValue]="fa.account_id">{{ fa.username }}</option>
              </select>
              <button nbButton status="success" size="tiny" style="margin-left:4px" (click)="saveAssign(did)">Save</button>
              <button nbButton ghost size="tiny" (click)="cancelAssign()">Cancel</button>
            </span>
          </td>
          <td style="padding:8px">{{ did.description }}</td>
          <td style="padding:8px">
            <button *ngIf="isAdmin" nbButton ghost size="tiny" (click)="edit(did)">Edit</button>
            <button *ngIf="assigningId !== did.id" nbButton status="info" size="tiny" (click)="startAssign(did)" style="margin-left:4px">Assign</button>
            <button *ngIf="isAdmin" nbButton status="danger" ghost size="tiny" style="margin-left:4px" (click)="delete(did)">Delete</button>
          </td>
        </tr>
        <tr *ngIf="dids.length === 0">
          <td [attr.colspan]="isAdmin ? 5 : 4" style="padding:16px;text-align:center;color:#888">No DIDs found.</td>
        </tr>
      </tbody>
    </table>

  </nb-card-body>
</nb-card>
